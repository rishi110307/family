name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Verify web assets
        run: |
          ls -la
          ls -la www/

      - name: Install Capacitor Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Sync Web Code to Android
        run: |
          npx cap sync

      - name: Fix Kotlin version conflicts
        run: |
          cd android
          python3 <<'EOF'
          with open('build.gradle', 'r') as f:
              content = f.read()

          if 'kotlin-stdlib' not in content:
              content += """

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          """

          with open('build.gradle', 'w') as f:
              f.write(content)
          EOF

      # ⬇️ NEW: Grant location + internet permissions
      - name: Add Android location permissions
        run: |
          cd android
          python3 <<'EOF'
          path = "app/src/main/AndroidManifest.xml"

          with open(path, "r") as f:
              content = f.read()

          perms = [
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.INTERNET" />',
          ]

          missing = [p for p in perms if p not in content]
          if missing:
              insert_block = "\n    " + "\n    ".join(missing) + "\n"
              content = content.replace("</manifest>", insert_block + "</manifest>")

          with open(path, "w") as f:
              f.write(content)

          print("Patched AndroidManifest.xml")
          print(open(path).read())
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardianx-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
