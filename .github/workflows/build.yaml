name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Verify web assets
        run: |
          ls -la
          ls -la www/

      - name: Install Capacitor Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Sync Web Code to Android
        run: |
          npx cap sync

      # ⬇️ FIX: Force Kotlin versions to align across all modules
      - name: Fix Kotlin version conflicts
        run: |
          cd android
          # Add resolution strategy to the project-level build.gradle
          python3 <<'EOF'
          import re

          # 1. Patch android/build.gradle (project root of the android project)
          with open('build.gradle', 'r') as f:
              content = f.read()

          # Ensure repositories include google() and mavenCentral()
          if 'mavenCentral()' not in content:
              content = content.replace(
                  'repositories {',
                  'repositories {\n        mavenCentral()',
                  1
              )

          # Add resolution strategy if not present
          if 'kotlin-stdlib' not in content:
              content += """

          // Force single Kotlin version to fix duplicate class errors
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          """

          with open('build.gradle', 'w') as f:
              f.write(content)

          print("Patched android/build.gradle")
          print("----")
          print(open('build.gradle').read())
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardianx-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
