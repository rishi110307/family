name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ⬇️ NEW: Install Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify web assets
        run: |
          echo "Repo contents:"
          ls -la
          echo "www folder contents:"
          ls -la www/

      - name: Install Capacitor Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Sync Web Code to Android
        run: |
          npx cap sync

      # ⬇️ NEW: Fix Gradle to use compatible Java version
      - name: Set Gradle Java Home
        run: |
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "org.gradle.jvmargs=-Xmx2048m" >> android/gradle.properties

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardianx-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
